name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore QbitAllocator.slnx

      - name: Build
        run: dotnet build QbitAllocator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test QbitAllocator.slnx --configuration Release --no-build
